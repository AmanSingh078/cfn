AWSTemplateFormatVersion: '2010-09-09'
Description: Simple S3 website bucket

Resources:
  WebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      WebsiteConfiguration:
        IndexDocument: index.html

Outputs:
  WebsiteBucketName:
    Description: Website bucket name
    Value: !Ref WebsiteBucket
